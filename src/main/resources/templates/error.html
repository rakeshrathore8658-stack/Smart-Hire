<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire - System Notification</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f8fafc;
            color: #1e293b;
        }
        .card {
            background: #fff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            text-align: center;
            max-width: 480px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #ff6b35; }
        p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
        a.btn {
            display: inline-block;
            background: #ff6b35;
            color: #fff;
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 th:text="${errorTitle != null ? errorTitle : 'SmartHire Notice'}">SmartHire Notice</h1>
        <p th:text="${errorMessage != null ? errorMessage : 'The requested resource is managed by the SmartHire Web Application.'}">Notice details</p>
        <a class="btn" href="http://localhost:5173/">Return to SmartHire &rarr;</a>
    </div>
</body>
</html>
