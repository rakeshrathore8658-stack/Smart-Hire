<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire - System Notification</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f8fafc;
            color: #1e293b;
        }
        .card {
            background: #fff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            text-align: center;
            max-width: 480px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #ff6b35; }
        p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
        a.btn {
            display: inline-block;
            background: #ff6b35;
            color: #fff;
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
    <script>
        var isProd = window.location.hostname.includes("onrender.com") || (!window.location.hostname.includes("localhost") && !window.location.hostname.includes("127.0.0.1"));
        var base = isProd ? "https://resume-analyzer-sigma-nine.vercel.app" : "http://localhost:5173";
        var search = window.location.search || "";
        if (search.includes("code=") || search.includes("state=") || !search) {
            search = "?oauth_error=" + encodeURIComponent("Role Mismatch: Ye email address already doosre portal ke liye registered hai. Ek email ke corresponding sirf ek dashboard (Job Seeker ya HR) me sign in kiya ja sakta hai. Please apna registered portal select karke sign in karein.");
        }
        window.location.replace(base + "/login" + search);
    </script>
</head>
<body>
    <div class="card">
        <h1 th:text="${errorTitle != null ? errorTitle : 'SmartHire Notice'}">SmartHire Notice</h1>
        <p th:text="${errorMessage != null ? errorMessage : 'Redirecting to SmartHire Web Application...'}">Notice details</p>
        <a id="returnBtn" class="btn" href="http://localhost:5173/">Return to SmartHire &rarr;</a>
    </div>
    <script>
        var isProd = window.location.hostname.includes("onrender.com") || (!window.location.hostname.includes("localhost") && !window.location.hostname.includes("127.0.0.1"));
        var base = isProd ? "https://resume-analyzer-sigma-nine.vercel.app" : "http://localhost:5173";
        var search = window.location.search || "";
        if (search.includes("code=") || search.includes("state=") || !search) {
            search = "?oauth_error=" + encodeURIComponent("Role Mismatch: Ye email address already doosre portal ke liye registered hai. Ek email ke corresponding sirf ek dashboard (Job Seeker ya HR) me sign in kiya ja sakta hai. Please apna registered portal select karke sign in karein.");
        }
        document.getElementById("returnBtn").href = base + "/login" + search;
    </script>
</body>
</html>
