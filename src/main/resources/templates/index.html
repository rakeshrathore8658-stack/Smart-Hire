<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire - AI Resume Analyzer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f8fafc;
            color: #1e293b;
        }
        .card {
            background: #fff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            text-align: center;
            max-width: 480px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #ff6b35; }
        p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
        a.btn {
            display: inline-block;
            background: #ff6b35;
            color: #fff;
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        a.btn:hover { background: #e85924; }
    </style>
    <script>
        var isProd = window.location.hostname.includes("onrender.com") || (!window.location.hostname.includes("localhost") && !window.location.hostname.includes("127.0.0.1"));
        var base = isProd ? "https://resume-analyzer-sigma-nine.vercel.app" : "http://localhost:5173";
        window.location.replace(base + "/" + window.location.search);
    </script>
</head>
<body>
    <div class="card">
        <h1>SmartHire Backend Online</h1>
        <p>Spring Boot backend is connected to Neon PostgreSQL.<br>Redirecting you to the SmartHire Web Application...</p>
        <a id="appBtn" class="btn" href="http://localhost:5173/">Open SmartHire Web App &rarr;</a>
    </div>
    <script>
        var isProd = window.location.hostname.includes("onrender.com") || (!window.location.hostname.includes("localhost") && !window.location.hostname.includes("127.0.0.1"));
        var base = isProd ? "https://resume-analyzer-sigma-nine.vercel.app" : "http://localhost:5173";
        document.getElementById("appBtn").href = base + "/" + window.location.search;
    </script>
</body>
</html>
