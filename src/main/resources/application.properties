spring.application.name=ResumeAnalyzer
server.port=${PORT:8080}

# MySQL Database Configuration
#spring.datasource.url=jdbc:mysql://localhost:3306/demo
#spring.datasource.username=root
#spring.datasource.password=root

# Neon PostgreSQL Database Configuration (Direct Connection recommended for Spring Boot + HikariCP)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-silent-pine-az3pjbgw.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_SoywjhbC9vr5}
spring.datasource.driver-class-name=org.postgresql.Driver

# CORS Configuration (comma-separated origins like https://my-app.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Multipart File Upload Limits (Supports PDF, DOC, DOCX up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# AI Provider Configuration ("local", "gemini", or "ollama")
ai.provider=local
ai.ollama.base-url=http://localhost:11434
ai.ollama.model=codellama
ai.ollama.timeout-seconds=60

ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ai.gemini.timeout-seconds=45

# ATS Transparent Scoring Weights (Total 100%)
ats.weights.skills-weight=0.30
ats.weights.experience-weight=0.20
ats.weights.projects-weight=0.15
ats.weights.education-weight=0.10
ats.weights.keywords-weight=0.10
ats.weights.formatting-weight=0.10
ats.weights.content-quality-weight=0.05

# Disable DevTools RestartClassLoader to avoid JDK 25 dual-classloader LinkageError
spring.devtools.restart.enabled=false

# Thymeleaf Configuration (Graceful redirect templates for browser requests to port 8080)
spring.thymeleaf.check-template-location=true

# Persistent Session Configuration (Keep user logged in across devices)
# When deploying frontend on Vercel and backend on Render (cross-site), set COOKIE_SAME_SITE=none and COOKIE_SECURE=true
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=2592000
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
