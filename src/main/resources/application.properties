spring.application.name=SmartHire
server.port=${PORT:8080}

# Neon PostgreSQL Database Configuration (Direct Connection recommended for Spring Boot + HikariCP)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-silent-pine-az3pjbgw.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&connectTimeout=10&socketTimeout=45&tcpKeepAlive=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_SoywjhbC9vr5}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration (Optimized for Neon Serverless PostgreSQL)
spring.datasource.hikari.pool-name=SmartHireHikariPool
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.validation-timeout=4000


# CORS Configuration (comma-separated origins like https://my-app.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://resume-analyzer-sigma-nine.vercel.app}

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Multipart File Upload Limits (Supports PDF, DOC, DOCX up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Cloudinary File Storage Configuration (Configured securely via environment variables)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# AI Provider Configuration ("local", "gemini", or "ollama")
ai.provider=local
ai.ollama.base-url=http://localhost:11434
ai.ollama.model=qwen3:4b
ai.ollama.timeout-seconds=35

ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
ai.gemini.timeout-seconds=15

# ATS Transparent Scoring Weights (Total 100%)
ats.weights.skills-weight=0.30
ats.weights.experience-weight=0.20
ats.weights.projects-weight=0.15
ats.weights.education-weight=0.10
ats.weights.keywords-weight=0.10
ats.weights.formatting-weight=0.10
ats.weights.content-quality-weight=0.05

# Disable redundant default OAuth2 web security filter chain auto-configuration (Custom SecurityFilterChain defined in SecurityConfig)
spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration

# Disable DevTools RestartClassLoader to avoid JDK 25 dual-classloader LinkageError
spring.devtools.restart.enabled=false

# Thymeleaf Configuration (Graceful redirect templates for browser requests to port 8080)
spring.thymeleaf.check-template-location=true

# Google OAuth2 Client Configuration (spring-boot-starter-oauth2-client)
# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET via environment variables:
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Frontend Application URL for OAuth2 redirects (Default: http://localhost:5173, Override in production on Render with Vercel frontend URL)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Persistent Session Configuration (Keep user logged in across devices)
# When deploying frontend on Vercel and backend on Render (cross-site), set COOKIE_SAME_SITE=none and COOKIE_SECURE=true
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=2592000
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Jackson Deserialization Safety (Permissive primitive null mapping & unknown property tolerance)
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false
